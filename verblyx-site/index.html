<title>Verblyx | Apprendre l'anglais facilement</title>
<meta name="theme-color" content="#1A1C23">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&family=Dosis:wght@800&display=swap">
<style>
/* Verblyx — Ocean Pulse. Une colonne d'apprentissage au centre, navigation à gauche, motivation à droite (grand écran). Thème sombre unique, voulu par la marque. */
:root {
  --bg: #1A1C23;
  --bg-raise: #15161C;
  --surface: #22242D;
  --surface-2: #292C37;
  --surface-3: #333744;
  --line: #2C2F3B;
  --line-2: #3C4152;
  --fg: #EAFBFF;
  --fg-2: #C9CDD6;
  --muted: #9AA0AE;
  --faint: #6B7180;
  --primary: #1677FF;
  --primary-hi: #2E87FF;
  --primary-soft: rgba(22, 119, 255, .14);
  --primary-text: #8CC2FF;
  --success: #00D6B5;
  --success-soft: rgba(0, 214, 181, .13);
  --success-ink: #03261F;
  --danger: #FF6B81;
  --danger-soft: rgba(255, 107, 129, .11);
  --warn: #FFC45C;
  --f-display: "Plus Jakarta Sans", "Inter", system-ui, sans-serif;
  --f-body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r-sm: 10px;
  --r: 14px;
  --r-lg: 20px;
  --ease: cubic-bezier(.2, .8, .2, 1);
  --spring: cubic-bezier(.2, .9, .25, 1.15);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; overflow-x: hidden; overscroll-behavior: none; touch-action: manipulation; }
body { overscroll-behavior: none; }
@supports (overflow: clip) { html { overflow-x: clip; } }
* { -webkit-tap-highlight-color: transparent; }
@media (max-width: 1023px) { input, textarea, select, .input, .composer input { font-size: 16px !important; } }
body {
  background: radial-gradient(1100px 520px at 50% -240px, rgba(22, 119, 255, .13), transparent 70%) no-repeat, var(--bg);
  color: var(--fg); font: 400 15px/1.6 var(--f-body); -webkit-font-smoothing: antialiased;
}
h1, h2, h3, h4 { font-family: var(--f-display); margin: 0; letter-spacing: -.015em; text-wrap: balance; }
p { margin: 0; }
button { font: inherit; color: inherit; }
img, svg { max-width: 100%; }
:focus-visible { outline: 2px solid var(--primary-hi); outline-offset: 2px; border-radius: 10px; }
::selection { background: rgba(22, 119, 255, .4); }
#app { min-height: 100%; }

/* Typographie */
.h1 { font-size: clamp(26px, 3.2vw, 32px); line-height: 1.2; font-weight: 800; }
.h2 { font-size: 22px; line-height: 1.3; font-weight: 700; }
.h3 { font-size: 17px; line-height: 1.35; font-weight: 700; }
.label { font: 600 12px/1.2 var(--f-body); letter-spacing: .07em; text-transform: uppercase; color: var(--muted); }
.muted { color: var(--muted); }
.soft { color: var(--fg-2); }
.small { font-size: 13px; }
.num { font-variant-numeric: tabular-nums; }
.grad-text { background: linear-gradient(95deg, #5AA6FF, var(--success)); -webkit-background-clip: text; background-clip: text; color: transparent; }

/* Mise en page */
.stack { display: flex; flex-direction: column; gap: 16px; }
.row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.between { justify-content: space-between; }
.wrap { width: 100%; max-width: 1120px; margin: 0 auto; padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); }
.grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
@media (max-width: 640px) { .grid-2 { grid-template-columns: 1fr; } }

/* Boutons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 48px; padding: 0 22px; border: 0; border-radius: var(--r); font: 600 15px/1 var(--f-body); cursor: pointer; white-space: nowrap; transition: background-color .15s, box-shadow .15s, transform .1s, color .15s; text-decoration: none; -webkit-tap-highlight-color: transparent; }
.btn:active:not(:disabled) { transform: translateY(1px) scale(.985); }
.btn .ico { width: 18px; height: 18px; }
.btn-primary { background: var(--primary); color: #fff; box-shadow: inset 0 -2px 0 rgba(0, 0, 0, .18), 0 8px 20px -12px rgba(22, 119, 255, .9); }
.btn-primary:hover:not(:disabled) { background: var(--primary-hi); }
.btn-success { background: var(--success); color: var(--success-ink); box-shadow: inset 0 -2px 0 rgba(0, 0, 0, .15); }
.btn-success:hover:not(:disabled) { background: #20E2C3; }
.btn-secondary { background: var(--surface); color: var(--fg); box-shadow: inset 0 0 0 1.5px var(--line-2); }
.btn-secondary:hover:not(:disabled) { background: var(--surface-2); }
.btn-ghost { background: transparent; color: var(--fg-2); height: 40px; padding: 0 14px; }
.btn-ghost:hover:not(:disabled) { background: var(--surface); color: var(--fg); }
.btn:disabled { background: var(--surface-2); color: var(--faint); box-shadow: none; cursor: not-allowed; }
.btn-lg { height: 56px; padding: 0 28px; font-size: 16px; border-radius: 16px; }
.btn-block { width: 100%; }
.btn-sm { height: 36px; padding: 0 14px; font-size: 13.5px; border-radius: 11px; }
.icon-btn { width: 40px; height: 40px; flex: none; display: grid; place-items: center; border: 0; border-radius: 12px; background: transparent; color: var(--muted); cursor: pointer; transition: background-color .15s, color .15s; }
.icon-btn:hover { background: var(--surface); color: var(--fg); }
.icon-btn .ico { width: 20px; height: 20px; }
.link { background: none; border: 0; padding: 0; color: var(--primary-text); font: 600 13.5px var(--f-body); cursor: pointer; }
.link:hover { color: var(--fg); }
.ico { width: 20px; height: 20px; flex: none; }
.spinner { width: 18px; height: 18px; border-radius: 50%; border: 2.5px solid rgba(234, 251, 255, .22); border-top-color: currentColor; animation: spin .8s linear infinite; flex: none; }
@keyframes spin { to { transform: rotate(360deg); } }

/* Surfaces */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); }
.pad { padding: 24px; }
@media (max-width: 520px) { .pad { padding: 18px; } }
.chip { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px; border-radius: 999px; background: var(--surface-2); color: var(--fg-2); font: 500 12.5px var(--f-body); white-space: nowrap; }
.chip-blue { background: var(--primary-soft); color: var(--primary-text); }
.chip-teal { background: var(--success-soft); color: var(--success); }
.chip-red { background: var(--danger-soft); color: #FFB1BE; }
.progress { height: 10px; border-radius: 999px; background: var(--surface-3); overflow: hidden; }
.progress > span { display: block; height: 100%; border-radius: inherit; background: var(--success); transition: width .8s var(--ease); }
.progress.thin { height: 6px; }
.notice { --nc: var(--primary-text); --nb: rgba(140, 194, 255, .1); display: flex; gap: 12px; align-items: center; padding: 11px 14px 11px 12px; border-radius: 14px; font: 500 14px/1.45 var(--f-body); background: linear-gradient(90deg, var(--nb), rgba(255, 255, 255, .015)); color: var(--fg); border: 1px solid var(--line-2); border-left: 3px solid var(--nc); animation: noticeIn .28s cubic-bezier(.2, .8, .3, 1.2); }
.notice .n-ic { flex: none; display: grid; place-items: center; width: 26px; height: 26px; border-radius: 9px; background: var(--nc); color: #14161C; }
.notice .n-ic svg { width: 16px; height: 16px; }
.cf-box { display: flex; justify-content: center; }
.gsi-wrap { position: relative; display: flex; justify-content: center; min-height: 48px; }
.gsi-wrap .gsi-slot { display: none; }
.gsi-wrap.is-ready .gsi-slot { display: flex; justify-content: center; width: 100%; }
.gsi-wrap.is-ready .gsi-alt { display: none; }
.gsi-wrap .gsi-alt { width: 100%; }
.notice .n-tx { min-width: 0; overflow-wrap: anywhere; }
.notice-error { --nc: var(--danger); --nb: rgba(255, 107, 129, .12); }
.notice-warn { --nc: var(--warn); --nb: rgba(255, 196, 92, .1); }
.notice-success { --nc: var(--success); --nb: rgba(0, 214, 181, .1); }
.notice.sm { padding: 8px 12px 8px 9px; font-size: 13.5px; border-radius: 12px; margin-top: 8px; }
.notice.sm .n-ic { width: 22px; height: 22px; border-radius: 7px; }
.notice.sm .n-ic svg { width: 14px; height: 14px; }
@keyframes noticeIn { from { opacity: 0; transform: translateY(-4px); } }
.skel { border-radius: 10px; background: linear-gradient(90deg, var(--surface) 0%, var(--surface-2) 50%, var(--surface) 100%); background-size: 200% 100%; animation: skel 1.4s ease-in-out infinite; }
@keyframes skel { from { background-position: 100% 0; } to { background-position: -100% 0; } }

/* Champs */
.field { display: flex; flex-direction: column; gap: 6px; }
.input { width: 100%; height: 48px; padding: 0 14px; border-radius: 12px; border: 1.5px solid var(--line-2); background: var(--bg-raise); color: var(--fg); font: 400 15px var(--f-body); transition: border-color .15s, box-shadow .15s; }
textarea.input { height: auto; min-height: 120px; padding: 12px 14px; line-height: 1.55; resize: vertical; }
.input::placeholder { color: var(--faint); }
.pw-wrap { position: relative; display: block; width: 100%; }
.pw-wrap > .input { padding-right: 48px; }
.pw-eye { position: absolute; top: 50%; right: 6px; transform: translateY(-50%); width: 38px; height: 38px; display: grid; place-items: center; border: 0; border-radius: 10px; background: transparent; color: var(--faint); cursor: pointer; -webkit-tap-highlight-color: transparent; }
@media (hover: hover) { .pw-eye:hover { color: var(--fg); background: var(--surface-3); } }
.pw-eye svg { width: 20px; height: 20px; }
.input::-ms-reveal { display: none; }
.input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-soft); }

/* Choix (questionnaire, test, exercices) */
.options { display: flex; flex-direction: column; gap: 10px; }
.options.grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); }
@media (max-width: 560px) { .options.grid { grid-template-columns: 1fr; } }

.segmented button.is-active { background: var(--surface-3); color: var(--fg); }
.words { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
.word { padding: 16px; display: flex; flex-direction: column; gap: 4px; }
.tick { width: 32px; height: 32px; flex: none; border-radius: 10px; border: 1.5px solid var(--line-2); background: transparent; color: var(--muted); display: grid; place-items: center; cursor: pointer; transition: all .15s; }
.tick .ico { width: 16px; height: 16px; }
.tick.on { background: var(--success); border-color: var(--success); color: var(--success-ink); }

.boot-in { display: flex; flex-direction: column; align-items: center; gap: 14px; }
.boot-vx .vx-head { animation: boot-tilt 2.4s ease-in-out infinite; }
@keyframes boot-tilt { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(-4deg); } }
.boot-txt { font: 600 15px var(--f-body); color: var(--muted); letter-spacing: .02em; }
.boot-dots i { font-style: normal; animation: boot-dot 1.2s ease-in-out infinite; }
.boot-dots i:nth-child(2) { animation-delay: .2s; } .boot-dots i:nth-child(3) { animation-delay: .4s; }
@keyframes boot-dot { 0%, 60%, 100% { opacity: .2; } 30% { opacity: 1; } }
/* Chargement initial */
.boot { min-height: 100vh; display: grid; place-items: center; }

/* Entrées */
@keyframes enter { from { opacity: .001; transform: translateY(8px); } to { opacity: 1; transform: none; } }
.enter { animation: enter .45s var(--ease) both; }
.enter-2 { animation: enter .45s .06s var(--ease) both; }
.enter-3 { animation: enter .45s .12s var(--ease) both; }
#app.static .enter, #app.static .enter-2, #app.static .enter-3 { animation: none; }

/* Carte du parcours */
.map { display: flex; flex-direction: column; gap: 18px; }
.lvl-block { display: flex; flex-direction: column; gap: 18px; }
/* le niveau en cours reste affiché en haut pendant qu'on parcourt le chemin */
.lvl-block.is-current > .lvl-head { position: sticky; top: 12px; z-index: 8; border-color: rgba(22, 119, 255, .45); box-shadow: 0 10px 24px -10px rgba(0, 0, 0, .8), 0 0 0 6px var(--bg); }
@media (max-width: 719px) { .lvl-block.is-current > .lvl-head { top: calc(var(--mtoph, 53px) + env(safe-area-inset-top, 0px) + 8px); } }
.lvl-head { display: flex; align-items: center; gap: 14px; width: 100%; padding: 12px 14px; border: 1px solid var(--line); border-radius: 18px; background: var(--surface); color: var(--fg); cursor: pointer; text-align: left; transition: border-color .15s; }
.lvl-head:hover { border-color: var(--line-2); }
.lvl-head .ico { color: var(--muted); }
.lvl-badge { width: 44px; height: 44px; flex: none; border-radius: 13px; display: grid; place-items: center; background: var(--primary); color: #fff; font: 800 16px var(--f-display); }
.lvl-block.is-locked .lvl-badge { background: var(--surface-3); color: var(--muted); }
.lvl-tx { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.lvl-tx b { font: 700 16px var(--f-display); }
.lvl-tx span { font-size: 13px; color: var(--muted); }
.lvl-desc { padding: 0 6px; margin-top: -8px; }
.unit { display: flex; flex-direction: column; gap: 6px; }
.unit-banner { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 16px; border-radius: 18px; background: var(--surface-2); border: 1px solid var(--line); }
.unit-banner.is-current { background: var(--primary); border-color: var(--primary); color: #fff; }
.unit-banner b { display: block; font: 800 18px/1.25 var(--f-display); }
.unit-k { font: 700 11.5px var(--f-body); letter-spacing: .07em; text-transform: uppercase; opacity: .8; }
.guide-btn { display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 14px; border-radius: 12px; border: 1.5px solid rgba(234,251,255,.35); background: transparent; color: inherit; font: 700 13px var(--f-body); letter-spacing: .04em; text-transform: uppercase; cursor: pointer; flex: none; }
.guide-btn:hover { background: rgba(234,251,255,.1); }
.guide-btn .ico { width: 18px; height: 18px; }
@media (max-width: 420px) { .guide-btn span { display: none; } .guide-btn { padding: 0 10px; } }
.trail { position: relative; display: flex; flex-direction: column; align-items: center; gap: 16px; padding: 22px 0 18px; }
.stop { position: relative; transform: translateX(var(--x)); display: flex; flex-direction: column; align-items: center; }
.stop:has(.pop) { z-index: 20; }
.trail-vex { z-index: 1; }
.node2 { position: relative; width: 70px; height: 64px; border: 0; border-radius: 50%; display: grid; place-items: center; cursor: pointer; color: #fff; background: var(--surface-3); box-shadow: 0 6px 0 #15161C; transition: transform .1s, box-shadow .1s, filter .15s; -webkit-tap-highlight-color: transparent; }
.node2 .ico { width: 30px; height: 30px; }
.node2:active { transform: translateY(4px); box-shadow: 0 2px 0 #15161C; }
.node2.locked { color: var(--faint); }
.node2.done, .node2.skipped { background: var(--success); color: var(--success-ink); box-shadow: 0 6px 0 #0A8C77; }
.node2.skipped { filter: saturate(.55) brightness(.85); }
.node2.current { background: var(--primary); box-shadow: 0 6px 0 #0B4FB8, 0 0 0 8px rgba(22,119,255,.18); }
.node2.current:active { box-shadow: 0 2px 0 #0B4FB8, 0 0 0 8px rgba(22,119,255,.18); }
.node2.unit, .node2.exam { width: 76px; height: 70px; border-radius: 22px; }
.node2.current::after { content: ""; position: absolute; inset: -12px; border-radius: inherit; border: 3px solid rgba(22,119,255,.45); animation: ring 2s var(--ease) infinite; }
@keyframes ring { 0% { transform: scale(.9); opacity: 1; } 100% { transform: scale(1.18); opacity: 0; } }
.start-tip { position: absolute; bottom: calc(100% + 14px); white-space: nowrap; padding: 8px 14px; border-radius: 12px; background: var(--surface); border: 1.5px solid var(--line-2); color: var(--primary-text); font: 800 13px var(--f-body); letter-spacing: .05em; text-transform: uppercase; animation: tip 2.4s ease-in-out infinite; z-index: 2; }
.start-tip::after { content: ""; position: absolute; left: 50%; bottom: -7px; width: 12px; height: 12px; background: var(--surface); border-right: 1.5px solid var(--line-2); border-bottom: 1.5px solid var(--line-2); transform: translateX(-50%) rotate(45deg); }
@keyframes tip { 0%, 100% { translate: 0 0; } 50% { translate: 0 -4px; } }
.stop:has(.start-tip) { margin-top: 44px; }
.pop { position: absolute; top: calc(100% + 14px); z-index: 5; width: min(300px, 80vw); display: flex; flex-direction: column; gap: 8px; padding: 16px; border-radius: 18px; background: var(--primary); color: #fff; box-shadow: 0 20px 40px -18px rgba(0,0,0,.8); text-align: left; animation: pop-in .22s var(--spring) both; }
.pop .label { color: rgba(255,255,255,.75); }
.pop .soft, .pop .muted { color: rgba(255,255,255,.82); }
.pop .btn-primary { background: #fff; color: var(--primary); box-shadow: inset 0 -2px 0 rgba(0,0,0,.12); }
.pop .btn-secondary { background: rgba(255,255,255,.14); color: #fff; box-shadow: none; }
.pop.is-locked { background: var(--surface-2); border: 1px solid var(--line-2); }
.pop.is-locked .btn:disabled { background: var(--surface-3); color: var(--muted); }
@keyframes pop-in { from { opacity: 0; transform: translateY(-6px) scale(.96); } }
.trail-vex { position: absolute; top: 120px; left: 50%; margin-left: calc(var(--x) - 59px); pointer-events: auto; }
@media (max-width: 480px) { .trail-vex { display: none; } }
.guide-row { display: flex; gap: 12px; align-items: flex-start; }
.g-dot { width: 32px; height: 32px; flex: none; border-radius: 50%; display: grid; place-items: center; background: var(--surface-3); color: var(--muted); }
.g-dot .ico { width: 16px; height: 16px; }
.g-dot.done, .g-dot.skipped { background: var(--success); color: var(--success-ink); }
.g-dot.current { background: var(--primary); color: #fff; }

/* Portefeuille */
.pill-stat.gem .ico { color: var(--success); }
.pill-stat.coin .ico { color: var(--warn); }
.chip-btn { height: 36px; padding: 0 14px; border-radius: 11px; border: 1.5px solid var(--line-2); background: transparent; color: var(--fg-2); font: 600 13.5px var(--f-body); cursor: pointer; }
.chip-btn.is-on { background: var(--primary-soft); border-color: var(--primary); color: var(--primary-text); }

/* Séance */
.method { display: flex; gap: 6px; flex-wrap: wrap; }
.method span { height: 26px; padding: 0 10px; display: inline-flex; align-items: center; border-radius: 999px; font: 600 12px var(--f-body); color: var(--faint); background: var(--surface); }
.method span.past { color: var(--success); }
.method span.on { color: #fff; background: var(--primary); }
.ex-list { display: flex; flex-direction: column; gap: 10px; }
.ex-line { display: flex; gap: 8px; align-items: flex-start; }
.ex-line > div { display: flex; flex-direction: column; min-width: 0; }
.ex-line b { font-weight: 600; font-size: 15.5px; }
.ex-line span { font-size: 13.5px; color: var(--muted); }
.spk { width: 34px; height: 34px; color: var(--primary-text); }
.spk .ico { width: 18px; height: 18px; }
.parts { display: flex; flex-wrap: wrap; gap: 8px; }
.part { display: flex; flex-direction: column; padding: 10px 12px; border-radius: 12px; background: var(--bg-raise); border-top: 3px solid; min-width: 0; }
.part b { font: 700 17px var(--f-display); }
.part span { font-size: 12.5px; color: var(--muted); }
.part.p0 { border-color: var(--primary); } .part.p1 { border-color: var(--success); } .part.p2 { border-color: #8CC2FF; } .part.p3 { border-color: var(--warn); }
.tip { display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border-radius: 12px; background: var(--success-soft); color: var(--fg); font-size: 14px; }
.tip .ico { color: var(--success); width: 18px; height: 18px; margin-top: 2px; }
.vocab-chip { display: flex; flex-direction: row; gap: 6px; align-items: center; justify-content: flex-start; text-align: left; }
.vocab-chip > div { display: flex; flex-direction: column; min-width: 0; }
.answer-zone { min-height: 64px; display: flex; flex-wrap: wrap; align-content: flex-start; gap: 8px; padding: 10px 0; border-bottom: 2px solid var(--line-2); }
.answer-zone .small { align-self: center; }
.bank { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; padding-top: 6px; }
.tile { height: 44px; padding: 0 14px; border-radius: 12px; border: 1.5px solid var(--line-2); background: var(--surface); color: var(--fg); font: 600 15.5px var(--f-body); cursor: pointer; box-shadow: 0 3px 0 var(--line); transition: transform .08s; }
.tile:active:not(:disabled) { transform: translateY(2px); box-shadow: 0 1px 0 var(--line); }
.tile.used { visibility: hidden; }
.tile:disabled { cursor: default; }
.answer-zone.ok .tile { border-color: var(--success); }
.answer-zone.ko .tile { border-color: var(--danger); }
.match { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.match .col { display: flex; flex-direction: column; gap: 10px; }
.option.m { justify-content: center; text-align: center; min-height: 52px; }
.shake { animation: shake .35s ease; }
@keyframes shake { 20%, 60% { transform: translateX(-5px); } 40%, 80% { transform: translateX(5px); } }
.big-input { height: 56px; font-size: 17px; }
.passage p { font-size: 16px; line-height: 1.7; color: var(--fg-2); }
.passage { display: flex; gap: 8px; align-items: flex-start; }
.listen { justify-content: center; padding: 8px 0; }
.mic-zone { display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 12px 0; }
.mic { width: 84px; height: 84px; border-radius: 50%; border: 0; background: var(--primary); color: #fff; display: grid; place-items: center; cursor: pointer; box-shadow: 0 6px 0 #0B4FB8; }
.mic .ico { width: 34px; height: 34px; }
.mic.on { background: var(--danger); box-shadow: 0 0 0 10px var(--danger-soft); animation: pulse 1.2s ease-in-out infinite; }
@keyframes pulse { 50% { box-shadow: 0 0 0 18px rgba(255,107,129,.05); } }
.rewards { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
.rw { min-width: 96px; padding: 12px 14px; border-radius: 16px; background: var(--surface); border: 1px solid var(--line); display: flex; flex-direction: column; align-items: center; gap: 2px; }
.rw b { font: 800 22px var(--f-display); }

/* Identité Verblyx : voyage, cartes, Pulse */
.chapter { display: flex; flex-direction: column; gap: 10px; padding: 18px; border-radius: 20px; background: var(--surface); border: 1px solid var(--line); }
.chapter.is-current { border-color: rgba(22, 119, 255, .55); background: linear-gradient(180deg, rgba(22, 119, 255, .10), rgba(22, 119, 255, 0) 140px), var(--surface); }
.ch-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
.ch-k { display: block; font: 700 11.5px var(--f-body); letter-spacing: .08em; text-transform: uppercase; color: var(--primary-text); }
.ch-head b { display: block; font: 800 19px/1.25 var(--f-display); }
.ch-meta { display: flex; align-items: center; gap: 14px; flex: none; }
.voyage { list-style: none; margin: 8px 0 0; padding: 0; display: flex; flex-direction: column; }
.stn { position: relative; display: flex; gap: 14px; align-items: flex-start; padding-bottom: 8px; }
.stn::before { content: ""; position: absolute; left: 19px; top: 42px; bottom: -2px; width: 2px; border-radius: 2px; background: var(--line-2); }
.stn:last-child::before { display: none; }
.stn.done::before, .stn.skipped::before { background: var(--success); }
.stn-mark { position: relative; z-index: 1; width: 40px; height: 40px; flex: none; border-radius: 13px; display: grid; place-items: center; background: var(--surface-3); color: var(--muted); font: 800 15px var(--f-display); }
.stn-mark .ico { width: 18px; height: 18px; }
.stn.k-unit .stn-mark, .stn.k-exam .stn-mark { border-radius: 50%; }
.stn.done .stn-mark, .stn.skipped .stn-mark { background: var(--success); color: var(--success-ink); }
.stn.skipped .stn-mark { opacity: .7; }
.stn.current .stn-mark { background: var(--primary); color: #fff; }
.stn.current .stn-mark::after { content: ""; position: absolute; inset: -5px; border-radius: inherit; border: 2px solid rgba(22, 119, 255, .55); animation: pulse-ring 2.2s var(--ease) infinite; }
@keyframes pulse-ring { 0% { transform: scale(.92); opacity: 1; } 100% { transform: scale(1.25); opacity: 0; } }
.stn.locked .stn-mark { color: var(--faint); }
.stn-row { flex: 1; min-width: 0; min-height: 40px; display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 8px 12px; border: 0; border-radius: 12px; background: transparent; color: var(--fg); text-align: left; cursor: pointer; transition: background-color .15s; }
.stn-row:hover:not(:disabled) { background: var(--surface-2); }
.stn-row:disabled { cursor: default; color: var(--faint); }
.stn-t { font-weight: 600; font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.stn-card { flex: 1; min-width: 0; display: flex; align-items: flex-end; gap: 12px; padding: 16px; border-radius: 16px; background: var(--bg-raise); border: 1px solid var(--line-2); animation: card-in .28s var(--ease) both; }
.stn-card.current { border-color: rgba(22, 119, 255, .6); }
.stn-card .vx { margin: -6px -4px -16px 0; }
.stn-body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
.stn-body .btn { max-width: 100%; height: auto; min-height: 44px; padding: 10px 18px; white-space: normal; text-align: center; }
@keyframes card-in { from { opacity: 0; transform: translateY(-4px); } }
@media (max-width: 520px) { .stn-card .vx { display: none; } .ch-head { align-items: flex-start; flex-direction: column; gap: 6px; } }
.mdots { display: flex; flex-wrap: wrap; gap: 4px; }
.mdots span { padding: 2px 8px; border-radius: 999px; font: 600 11px var(--f-body); color: var(--muted); background: var(--surface-2); }
.mdots span.on { color: var(--success); background: var(--success-soft); }
.verdict { display: flex; gap: 12px; align-items: flex-start; padding: 14px 16px; border-radius: 16px; border: 1px solid var(--line-2); border-left-width: 4px; background: var(--surface); animation: card-in .3s var(--ease) both; }
.verdict.ok { border-left-color: var(--success); }
.verdict.ko { border-left-color: var(--danger); }
.verdict .vx { flex: none; }
.verdict.ok .fb-title { color: var(--success); }
.verdict.ko .fb-title { color: var(--danger); }
.foot-note { display: inline-flex; align-items: center; gap: 6px; font: 700 14px var(--f-body); color: var(--success); }
.foot-note .ico { width: 18px; height: 18px; }
.method-band { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; padding-block: 16px; }
@media (max-width: 760px) { .method-band { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.mb-it { display: flex; gap: 10px; align-items: flex-start; min-width: 0; }
.mb-n { font: 800 13px var(--f-display); color: var(--success); padding-top: 2px; }
.mb-it b { display: block; font: 700 14px var(--f-display); }
.mb-it span { font-size: 12.5px; color: var(--muted); }
/* Sans relief : boutons, tuiles et micro plats, à notre façon */
.btn-primary { box-shadow: 0 10px 24px -14px rgba(22, 119, 255, .95); }
.btn-success { box-shadow: 0 10px 24px -14px rgba(0, 214, 181, .8); }
.tile { box-shadow: none; border-radius: 999px; background: var(--surface-2); border-color: transparent; }
.tile:hover:not(:disabled) { border-color: var(--primary); }
.tile:active:not(:disabled) { transform: scale(.97); box-shadow: none; }
.answer-zone { min-height: 66px; padding: 10px 12px; border: 1.5px dashed var(--line-2); border-bottom-width: 1.5px; border-radius: 16px; background: var(--bg-raise); align-items: center; }
.answer-zone .tile { background: var(--primary-soft); color: var(--fg); }
.mic { box-shadow: 0 12px 30px -14px rgba(22, 119, 255, .9); }
.option { border-radius: 14px; }

/* Fête express de fin de leçon */
.cheer { min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding: 24px; cursor: pointer; background: radial-gradient(520px 360px at 50% 45%, rgba(0, 214, 181, .14), transparent 70%); }
.cheer-in { display: flex; flex-direction: column; align-items: center; gap: 14px; }
.cheer-bubble { position: relative; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 14px 26px; border-radius: 20px; background: var(--surface); border: 1px solid var(--line-2); animation: cel-pop .55s .15s var(--spring) both; }
.cheer-bubble::before { content: ""; position: absolute; top: -7px; left: 50%; width: 12px; height: 12px; background: var(--surface); border-left: 1px solid var(--line-2); border-top: 1px solid var(--line-2); transform: translateX(-50%) rotate(45deg); }
.cheer-bubble b { font: 800 26px/1.2 var(--f-display); color: var(--success); }
.cheer-bubble span { font: 600 17px var(--f-display); color: var(--fg); }
.cheer-xp { display: inline-flex; align-items: center; gap: 6px; font: 800 15px var(--f-body); color: var(--success); animation: cel-pop .45s .5s var(--spring) both; }
.cheer-xp .ico { width: 18px; height: 18px; }

/* Célébration de fin de questionnaire */
.celebrate { min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; text-align: center; padding: 32px max(20px, env(safe-area-inset-right, 0px)) 40px max(20px, env(safe-area-inset-left, 0px)); overflow: hidden; }
.cel-stage { position: relative; display: grid; place-items: center; width: 260px; height: 260px; }
.cel-stage .vx { position: relative; z-index: 1; }
.cel-ring { position: absolute; inset: 20px; border-radius: 50%; border: 2px solid rgba(0, 214, 181, .5); animation: cel-ring 2.4s var(--ease) infinite; }
.cel-ring.r2 { animation-delay: .8s; border-color: rgba(22, 119, 255, .5); }
.cel-ring.r3 { animation-delay: 1.6s; }
@keyframes cel-ring { 0% { transform: scale(.55); opacity: 0; } 25% { opacity: 1; } 100% { transform: scale(1.35); opacity: 0; } }
.cel-title { font: 800 clamp(28px, 5vw, 42px)/1.15 var(--f-display); animation: cel-pop .7s .15s var(--spring) both; }
.cel-sub { max-width: 30em; color: var(--fg-2); font-size: 16px; animation: enter .5s .45s var(--ease) both; }
.cel-chips { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
.cel-chips .chip { animation: cel-pop .45s var(--spring) both; }
.cel-chips .chip:nth-child(1) { animation-delay: .7s; } .cel-chips .chip:nth-child(2) { animation-delay: .85s; } .cel-chips .chip:nth-child(3) { animation-delay: 1s; }
.cel-bar { width: min(320px, 80vw); margin-top: 8px; }
.celebrate .btn { animation: enter .5s 1.2s var(--ease) both; }
@keyframes cel-pop { 0% { opacity: .001; transform: scale(.6); } 100% { opacity: 1; transform: none; } }

/* Vies, infobulles, boutique */
.pill-stat { border: 1px solid var(--line); color: var(--fg); cursor: pointer; font-family: var(--f-body); transition: border-color .15s, background-color .15s; }
.pill-stat:hover { border-color: var(--line-2); background: var(--surface-2); }
.pill-stat.heart .ico { color: #FF3B5C; filter: drop-shadow(0 0 4px rgba(255, 59, 92, .75)); }
.pill-stat.heart.low { border-color: rgba(255, 59, 92, .5); }
.tipped { position: relative; }
.tipped::after { content: attr(data-tip); position: absolute; top: calc(100% + 10px); right: 0; z-index: 60; width: max-content; max-width: 230px; padding: 9px 12px; border-radius: 12px; background: #262934; border: 1px solid var(--line-2); box-shadow: 0 14px 30px -14px rgba(0, 0, 0, .9); color: var(--fg); font: 500 12.5px/1.45 var(--f-body); text-align: left; white-space: normal; opacity: 0; transform: translateY(-4px); pointer-events: none; transition: opacity .15s, transform .15s; }
.tipped:hover::after, .tipped:focus-visible::after { opacity: 1; transform: none; }

/* ============ VEX ============ */
.vx { display: inline-block; position: relative; flex: none; line-height: 0; cursor: pointer; -webkit-tap-highlight-color: transparent; }
.vx svg { width: 100%; height: auto; overflow: visible; }
.vx * { transform-box: view-box; }
.vx-root { transform-origin: 100px 200px; }
.vx-bodyg { transform-origin: 100px 190px; animation: vx-breathe 3.8s ease-in-out infinite; }
.vx-head { transform-origin: 100px 128px; transform: rotate(var(--ht, 0deg)); transition: transform .6s var(--ease); }
.vx-headbob { animation: vx-bob 3.8s ease-in-out infinite; }
.vx-face { transform: translate(calc(var(--lx, 0px) + var(--px, 0px)), calc(var(--ly, 0px) + var(--py, 0px))); transition: transform .28s var(--ease); }
.vx-eye { transform-box: fill-box; transform-origin: center; }
.vx-mouth { transform-box: fill-box; transform-origin: center; }
.vx.talking .vx-mouth { animation: vx-talk .16s ease-in-out infinite alternate; }
.vx-arm { transform: rotate(var(--a, 0deg)); }
.vx-arm-l { transform-origin: 66px 132px; }
.vx-arm-r { transform-origin: 134px 132px; }
.vx-arm-l.up { transform-origin: 64px 136px; }
.vx-arm-r.up { transform-origin: 136px 136px; }
.vx-arm.waving { animation: vx-wave .42s ease-in-out 6 alternate; }
.vx-shadow { transform-origin: 100px 200px; }
.vx-prop { transform-box: fill-box; transform-origin: center; animation: vx-prop-in .4s var(--spring) both; }
.vx-bob { animation: vx-prop-in .4s var(--spring) both, vx-float 2.6s ease-in-out .4s infinite; }
.vx-twinkle { animation: vx-prop-in .4s var(--spring) both, vx-twinkle 1.8s ease-in-out .4s infinite; }
.vx-zzz { animation: vx-prop-in .4s var(--spring) both, vx-float 3.2s ease-in-out .4s infinite; }
.vx-drip { animation: vx-prop-in .4s var(--spring) both, vx-drip 1.6s ease-in .4s infinite; }
@keyframes vx-breathe { 0%, 100% { transform: scale(1, 1); } 50% { transform: scale(1.012, 1.022); } }
@keyframes vx-bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(1.6px); } }
@keyframes vx-talk { from { transform: scaleY(.55); } to { transform: scaleY(1.15); } }
@keyframes vx-wave { from { transform: rotate(-12deg); } to { transform: rotate(9deg); } }
@keyframes vx-prop-in { from { opacity: 0; transform: scale(.4); } to { opacity: 1; transform: none; } }
@keyframes vx-float { 0%, 100% { translate: 0 0; } 50% { translate: 0 -3px; } }
@keyframes vx-twinkle { 0%, 100% { opacity: 1; } 50% { opacity: .45; } }
@keyframes vx-drip { 0% { translate: 0 0; opacity: 1; } 80% { translate: 0 6px; opacity: .2; } 100% { translate: 0 6px; opacity: 0; } }
.vx-p { position: fixed; z-index: 60; width: 8px; height: 8px; border-radius: 2px; pointer-events: none; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; }
}

.bonus-title { position: relative; font: 800 34px/1.1 var(--f-display); letter-spacing: -.02em; }
.bonus-txt { position: relative; max-width: 26em; color: var(--fg-2); }
.bonus-prize { position: relative; display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; margin-top: 4px; }
.bonus-prize span { display: inline-flex; align-items: center; gap: 6px; height: 38px; padding: 0 14px; border-radius: 12px; background: var(--bg-raise); border: 1px solid var(--line-2); font: 800 15px var(--f-body); }
.cheer-bonus { display: inline-flex; align-items: center; gap: 6px; margin-top: 8px; padding: 6px 12px; border-radius: 999px; background: rgba(246, 190, 59, .14); color: #F6BE3B; font: 800 14px var(--f-body); animation: ex-pop .5s cubic-bezier(.3,1.5,.5,1) .5s both; }

@media (prefers-reduced-motion: reduce) { .flow-body.ex-fresh > *, .flow-body.ex-fresh .options > .option, .flow-body.ex-fresh .bank > .tile, .bonus-rays, .bonus-star { animation: none !important; } }
.tile.tile-st { display: inline-flex; align-items: center; }

/* ---------- Ranked ---------- */
.rk-hero { position: relative; display: flex; align-items: center; gap: 22px; padding: 22px 24px; border-radius: 22px; overflow: hidden; border: 1px solid color-mix(in srgb, var(--lg-a, #1677FF) 45%, transparent); background: radial-gradient(420px 220px at 0% 50%, var(--lg-glow, rgba(22,119,255,.2)), transparent 70%), var(--surface); }
.rk-emb { flex: none; position: relative; display: grid; place-items: center; }
.rk-emb::before { content: ""; position: absolute; inset: -14px; border-radius: 50%; background: radial-gradient(circle, var(--lg-glow, transparent), transparent 70%); animation: rk-pulse 2.8s ease-in-out infinite; }
@keyframes rk-pulse { 0%, 100% { transform: scale(.9); opacity: .7; } 50% { transform: scale(1.08); opacity: 1; } }
.lg-badge { display: inline-block; flex: none; }
.lg-badge.rk-big { position: relative; filter: drop-shadow(0 10px 22px rgba(0, 0, 0, .45)); animation: rk-float 3.2s ease-in-out infinite; }
@keyframes rk-float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
.lg-badge.rk-inline { vertical-align: -4px; margin: 0 3px 0 2px; }
.rk-info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.rk-name { font: 800 28px/1.1 var(--f-display); letter-spacing: -.02em; background: linear-gradient(180deg, #fff, var(--lg-a, #fff)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.rk-sub { color: var(--fg-2); font-size: 14.5px; } .rk-sub b { color: var(--fg); }
.rk-bar { height: 10px; margin-top: 8px; border-radius: 999px; background: var(--surface-3); overflow: hidden; }
.rk-bar span { display: block; height: 100%; border-radius: inherit; background: linear-gradient(90deg, var(--lg-b, #1677FF), var(--lg-a, #00D6B5)); animation: rk-grow 1s cubic-bezier(.2,.8,.2,1) both; }
@keyframes rk-grow { from { width: 0 !important; } }
.rk-goal { margin-top: 6px; font-size: 14px; color: var(--fg-2); line-height: 1.5; } .rk-goal b { color: var(--fg); }
.rk-warn { display: flex; align-items: flex-start; gap: 8px; margin-top: 8px; padding: 8px 10px; border-radius: 10px; background: rgba(255, 196, 92, .1); color: #FFD08A; font-size: 13px; } .rk-warn .ico { width: 16px; height: 16px; flex: none; transform: rotate(180deg); margin-top: 1px; } .rk-warn b { color: #FFE2B0; }
.rk-strip { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; }
.rk-lg { position: relative; display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 12px 4px 10px; border-radius: 16px; border: 1.5px solid var(--line); background: var(--surface); color: var(--fg-2); font: 700 12.5px var(--f-body); cursor: pointer; transition: transform .15s, border-color .15s, background .15s; }
.rk-lg.is-on { border-color: var(--primary); background: var(--primary-soft); color: var(--fg); }
.rk-lg.is-above .lg-badge { filter: saturate(.55) brightness(.8); opacity: .85; }
.rk-lg em { position: absolute; top: -8px; right: 6px; padding: 1px 6px; border-radius: 6px; background: #00D6B5; color: #04261F; font: 800 10px var(--f-body); font-style: normal; }
@media (hover: hover) { .rk-lg:hover { transform: translateY(-2px); border-color: var(--line-2); } }
.rk-list-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.rk-list-head > span:first-child { display: inline-flex; align-items: center; gap: 8px; font: 800 18px var(--f-display); }
.rk-list .lb2-score small { margin-left: 3px; font: 700 11px var(--f-body); color: var(--muted); }
.rk-list .rk-1 .lb2-rank { color: #FFC94A; } .rk-list .rk-2 .lb2-rank { color: #C9CED6; } .rk-list .rk-3 .lb2-rank { color: #E0915A; }
.rk-rules { padding: 16px 18px; border-radius: 16px; background: var(--bg-raise); border: 1px solid var(--line); font-size: 13.5px; color: var(--muted); display: flex; flex-direction: column; gap: 6px; } .rk-rules b { color: var(--fg-2); }
.lgm-badge { display: grid; place-items: center; margin: 4px auto 6px; filter: drop-shadow(0 0 30px var(--lg-glow)); }
@media (max-width: 560px) { .rk-hero { flex-direction: column; text-align: center; padding: 22px 16px; gap: 12px; } .rk-warn { text-align: left; } .rk-lg { font-size: 11px; padding: 10px 2px 8px; } .rk-lg .lg-badge { width: 28px; height: 30px; } .rk-name { font-size: 25px; } }
@media (prefers-reduced-motion: reduce) { .lg-badge.rk-big, .rk-emb::before { animation: none; } }

.rk-head { align-items: flex-start; flex-wrap: nowrap; }
.rk-refresh { flex: none; }
.rk-reset { display: flex; align-items: flex-start; gap: 10px; padding: 10px 14px; border-radius: 14px; background: var(--primary-soft); border: 1px solid rgba(22, 119, 255, .3); color: var(--fg-2); font-size: 13.5px; line-height: 1.45; }
.rk-reset .ico { width: 18px; height: 18px; flex: none; color: var(--primary-text); margin-top: 1px; }
.rk-reset b { color: var(--fg); }
.rk-place { display: flex; align-items: stretch; gap: 10px; flex-wrap: wrap; margin-top: 6px; }
.rk-place > div { display: flex; flex-direction: column; min-width: 92px; padding: 8px 12px; border-radius: 12px; background: rgba(0, 0, 0, .22); border: 1px solid rgba(255, 255, 255, .06); }
.rk-place span { font: 700 11px var(--f-body); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.rk-place b { font: 800 24px/1.15 var(--f-display); }
.rk-place small { font-size: 12px; color: var(--muted); }
.rk-place .btn { align-self: center; box-shadow: none; }
button.lb2-row.rk-mine { width: 100%; text-align: left; font: inherit; color: inherit; cursor: pointer; }
.pf-rk { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.pf-rk-card { display: flex; align-items: center; gap: 14px; padding: 16px; border-radius: 18px; border: 1.5px solid color-mix(in srgb, var(--lg-a, #888) 40%, transparent); background: radial-gradient(260px 120px at 0% 50%, var(--lg-glow, transparent), transparent 70%), var(--surface); color: inherit; font: inherit; text-align: left; cursor: pointer; min-width: 0; }
.pf-rk-card.is-empty { border-color: var(--line-2); cursor: default; }
.pf-rk-card .lg-badge { filter: drop-shadow(0 6px 14px rgba(0, 0, 0, .4)); }
.pf-rk-tx { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.pf-rk-tx > span { font: 700 11px var(--f-body); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.pf-rk-tx b { font: 800 19px/1.2 var(--f-display); }
.pf-rk-tx small { font-size: 12.5px; color: var(--muted); }
@media (hover: hover) { button.pf-rk-card:hover { transform: translateY(-2px); } }
@media (max-width: 560px) { .pf-rk { grid-template-columns: 1fr; } .rk-place { justify-content: center; } }

/* Ranked : carte compacte */
.rk-hero { flex-direction: column; align-items: stretch; gap: 10px; padding: 14px 16px; border-radius: 18px; background: radial-gradient(300px 140px at 0% 0%, var(--lg-glow, rgba(22,119,255,.2)), transparent 70%), var(--surface); text-align: left !important; }
.rk-top { display: flex; align-items: center; gap: 12px; min-width: 0; }
.rk-emb::before { inset: -8px; }
.rk-kick { font: 700 10.5px var(--f-body); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.rk-hero .rk-name { font-size: 21px; }
.rk-hero .rk-info { gap: 2px; }
.rk-chips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px; }
.rk-chips span { display: inline-flex; align-items: baseline; gap: 4px; height: 24px; padding: 0 8px; border-radius: 7px; background: rgba(0, 0, 0, .25); border: 1px solid rgba(255, 255, 255, .06); font-size: 12px; color: var(--muted); line-height: 24px; }
.rk-chips b { font: 800 14px var(--f-display); color: var(--fg); }
.rk-mebtn { margin-left: auto; flex: none; display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--line-2); background: var(--surface-2); color: var(--fg-2); font: 600 13px var(--f-body); cursor: pointer; }
.rk-mebtn .ico { width: 16px; height: 16px; }
@media (hover: hover) { .rk-mebtn:hover { color: var(--fg); border-color: var(--primary); } }
.rk-low .rk-bar { margin-top: 0; height: 8px; }
.rk-hero .rk-goal { margin-top: 6px; font-size: 13px; }
.rk-hero .rk-warn { margin-top: 6px; padding: 6px 10px; font-size: 12.5px; }
.rk-reset { padding: 8px 12px; font-size: 12.5px; }
@media (max-width: 560px) {
  .rk-hero { flex-direction: column; text-align: left; padding: 12px 14px; gap: 8px; }
  .rk-hero .lg-badge.rk-big { width: 46px; height: 50px; }
  .rk-hero .rk-name { font-size: 18px; }
  .rk-mebtn span { display: none; }
  .rk-mebtn { width: 34px; padding: 0; justify-content: center; }
  .rk-hero .rk-goal { font-size: 12.5px; }
}

/* boutons des leçons : on sent l'appui */
.flow .option, .flow .tile { transition: transform .12s ease, background-color .15s, border-color .15s, box-shadow .15s; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }

.flow .tile:active:not(:disabled) { transform: scale(.92); }

.flow .option.m.is-selected { box-shadow: 0 0 0 3px rgba(22, 119, 255, .25); }
.flow .option.m.is-right { opacity: .55; }
@media (hover: hover) { .flow .option:not(:disabled):hover { border-color: var(--primary); } }
.vp-link { padding: 0; border: 0; background: none; color: var(--primary-text); font: inherit; text-decoration: underline; cursor: pointer; }

   ============================================================ */
const writeQueues = {};
function queued(key, fn) {
  const prev = writeQueues[key] || Promise.resolve();
  const next = prev.catch(() => {}).then(fn);
  writeQueues[key] = next;
  return next;
}
function withTimeout(p, ms = 10000) {
  return Promise.race([p, new Promise((_, rej) => setTimeout(() => rej({ code: "timeout" }), ms))]);
}
function clone(o) { return JSON.parse(JSON.stringify(o)); }

function makeDbStore(db, uid) {
  const profileRef = db.doc(`data/users/${uid}/profile`);
  const vocabRef = db.doc(`data/users/${uid}/vocab`);
  const lessons = profileRef.collection("lessons");
  return {
    kind: "db",
    async loadProfile() { const s = await withTimeout(profileRef.get()); return s.exists ? clone(s.data()) : null; },
    saveProfile(p) { return queued("profile", () => profileRef.set(clone(p))); },
    async loadVocab() { const s = await withTimeout(vocabRef.get()); return s.exists ? clone(s.data()).words || {} : {}; },
    async loadContent(id) { const s = await withTimeout(db.doc("content/" + id).get()); return s.exists ? clone(s.data()).data || null : null; },
    saveContent(id, data) { return db.doc("content/" + id).set({ data: clone(data), v: 1, at: new Date().toISOString() }); },
    saveVocab(w) { return queued("vocab", () => vocabRef.set({ words: clone(w) })); },
    async listLessons() { const s = await withTimeout(lessons.orderBy("created_at", "desc").limit(200).get()); return s.docs.map((d) => clone(d.data())); },
    saveLesson(l) { return queued("lesson-" + l.id, () => lessons.doc(l.id).set(clone(l))); },
  };
}
function makeLocalStore() {
  const get = (k, d) => { try { const v = localStorage.getItem("verblyx:" + k); return v ? JSON.parse(v) : d; } catch { return d; } };
  const put = (k, v) => { try { localStorage.setItem("verblyx:" + k, JSON.stringify(v)); } catch {} return Promise.resolve(); };
  return {
    kind: "local",
    async loadProfile() { return get("profile", null); },
    saveProfile(p) { return put("profile", p); },
    async loadVocab() { return get("vocab", {}); },
    async loadContent(id) { return get("content:" + id, null); },
    saveContent(id, data) { return put("content:" + id, data); },
    saveVocab(w) { return put("vocab", w); },
    async listLessons() { return get("lessons", []).sort((a, b) => b.created_at.localeCompare(a.created_at)); },
    saveLesson(l) { const all = get("lessons", []).filter((x) => x.id !== l.id); all.push(l); return put("lessons", all); },
  };
}

function allowed(view) {

  if (view === "home") return "home";
  if (!p || !p.onboarded) return "onboarding";

  if (view === "review") return "coach";

/* ---------- Bruitages (synthétisés, aucun fichier) ---------- */
const SFX = (() => {
  let ctx = null, on = true;
  try { on = localStorage.getItem("verblyx:sound") !== "off"; } catch {}
  const ac = () => {
    if (!ctx) { try { ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch { return null; } }
    if (ctx.state === "suspended") ctx.resume().catch(() => {});
    return ctx.state === "running" ? ctx : null;
  };
  function tone(f, d, o = {}) {
    const c = ac(); if (!c) return;
    const { type = "sine", vol = 0.12, to = null, at = 0 } = o;
    const t = c.currentTime + at, osc = c.createOscillator(), g = c.createGain();
    osc.type = type; osc.frequency.setValueAtTime(f, t);
    if (to) osc.frequency.exponentialRampToValueAtTime(to, t + d);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.012); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    osc.connect(g).connect(c.destination); osc.start(t); osc.stop(t + d + 0.03);
  }
  const P = {
    tap: () => tone(520, .07, { to: 780, vol: .08 }),
    select: () => { tone(660, .08, { type: "triangle", vol: .1 }); tone(990, .1, { type: "triangle", vol: .09, at: .06 }); },
    unselect: () => tone(560, .09, { type: "triangle", vol: .07, to: 420 }),
    next: () => tone(320, .16, { to: 880, vol: .07 }),
    back: () => tone(700, .12, { to: 350, vol: .06 }),
    boing: () => { tone(240, .22, { to: 640, vol: .11 }); tone(640, .16, { to: 400, vol: .06, at: .17 }); },
    blip: () => tone(470 + Math.random() * 260, .04, { type: "square", vol: .018 }),
    correct: () => { tone(784, .12, { type: "triangle", vol: .12 }); tone(1175, .24, { type: "triangle", vol: .12, at: .1 }); },
    wrong: () => { tone(240, .16, { type: "sawtooth", vol: .045, to: 180 }); tone(190, .24, { type: "sawtooth", vol: .045, to: 120, at: .14 }); },
    fanfare: () => [523, 659, 784, 1047].forEach((f, i) => tone(f, i === 3 ? .5 : .14, { type: "triangle", vol: .11, at: i * .11 })),
    pop: () => tone(880, .09, { to: 1500, vol: .07 }),
    tick: () => { tone(1250, .035, { type: "triangle", vol: .07 }); tone(620, .05, { type: "sine", vol: .05, at: .012 }); },
    ding: () => { tone(988, .1, { type: "triangle", vol: .11 }); tone(1319, .12, { type: "triangle", vol: .11, at: .08 }); tone(1976, .28, { type: "sine", vol: .06, at: .17 }); tone(2637, .22, { type: "sine", vol: .03, at: .24 }); },
    oops: () => { tone(330, .12, { type: "triangle", vol: .09, to: 262 }); tone(247, .26, { type: "triangle", vol: .08, to: 196, at: .12 }); },
    whoosh: () => { tone(1400, .16, { type: "sine", vol: .035, to: 260 }); tone(700, .12, { type: "triangle", vol: .025, to: 180, at: .02 }); },
    combo: () => [659, 784, 988, 1319].forEach((f, i) => tone(f, .09, { type: "square", vol: .028, at: i * .055 })),
    bonus: () => { [1047, 1319, 1568, 2093].forEach((f, i) => tone(f, .18, { type: "sine", vol: .07, at: i * .08 })); tone(523, .5, { type: "triangle", vol: .06, at: .05 }); },
    jackpot: () => { [1568, 2093, 1568, 2093, 2637].forEach((f, i) => tone(f, .07, { type: "square", vol: .03, at: i * .06 })); [523, 659, 784, 1047].forEach((f, i) => tone(f, i === 3 ? .55 : .14, { type: "triangle", vol: .11, at: .3 + i * .1 })); },
  };
  return {
    play(n) { if (on && P[n]) { try { P[n](); } catch {} } },
    get on() { return on; },
    toggle() { on = !on; try { localStorage.setItem("verblyx:sound", on ? "on" : "off"); } catch {} if (on) P.select(); return on; },
  };
})();

function typeSpeech() {
  document.querySelectorAll(".speech .tw").forEach((el) => {
    const t = el.dataset.t || "";
    if (REDUCED || !t) return;
    const ch = el.closest(".ask") && el.closest(".ask").querySelector(".vx");
    if (ch) ch.classList.add("talking");
    let i = 0;
    const tick = () => {
      if (!el.isConnected) return;

      el.innerHTML = `<span>${esc(t.slice(0, i))}</span><span class="tw-off">${esc(t.slice(i))}</span>`;
      if (i % 3 === 1 && t[i - 1] !== " ") SFX.play("blip");
      if (i < t.length) setTimeout(tick, 20); else if (ch) ch.classList.remove("talking");
    };
    setTimeout(tick, 220);
  });
}

const PER_LEVEL = 3;
function testState() {
  const u = S.ui;
  if (!u.phase) {
    const i = LEVELS.indexOf(S.profile.self_level);
    Object.assign(u, { phase: "mcq", levelIdx: i < 0 ? 1 : Math.min(i, 3), tested: {}, answers: [], block: [], writing: "" });
  }
  return u;
}
function currentQuestion(u) {
  return BANK.find((q) => q.level === LEVELS[u.levelIdx] && !u.answers.some((a) => a.qid === q.id)) || null;
}
function scorePlacement(answers) {
  const per = {}; const wrong = [];
  for (const a of answers) {
    const q = BANK.find((b) => b.id === a.qid); if (!q) continue;
    per[q.level] = per[q.level] || { ok: 0, n: 0 }; per[q.level].n++;
    if (q.answer === a.answer) per[q.level].ok++; else wrong.push(q.skill);
  }
  let level = "A1";
  for (const l of LEVELS) { const p = per[l]; if (!p) continue; const acc = p.ok / p.n; if (acc >= 0.6) level = l; else if (acc < 0.4) break; }
  const correct = Object.values(per).reduce((s, p) => s + p.ok, 0);
  return { level, per, wrong, score: correct / (answers.length || 1) };
}

`Tu es examinateur certifié CECRL pour l'anglais. Évalue la production écrite d'un apprenant francophone.

      return ex.answer && words(ex.answer).length <= 12 ? ex : null;

function todayStrip() {

  const n = liveStreak(), week = weekActivity();

      <div class="ts-tx"><span>${tier === 1 ? "Objectif du jour" : "Objectif bonus"}</span><b class="num">${x}<small> / ${target} XP</small></b></div>

    <span class="ts-sep" aria-hidden="true"></span>
    <div class="ts-pulse">

    </div>
  </section>`;
}
function goalCard() {
  const g = goalXp(), x = todayXp(), tier = Math.floor(x / g) + 1, target = tier * g, pct = Math.min(100, ((x - (tier - 1) * g) / g) * 100);
  return `<section class="card pad ${tier > 1 ? "goal-bonus" : ""}">

}

  document.addEventListener("touchmove", (e) => { if (e.touches && e.touches.length > 1) stop(e); }, { passive: false });
  // le double-tap ne zoome plus grâce à touch-action: manipulation ; on ne bloque donc aucun toucher (les taps rapides passent)

  const setH = () => { const tb = document.querySelector(".tabbar"), mt = document.querySelector(".mtop"); const r = document.documentElement.style; if (tb && tb.offsetHeight) r.setProperty("--tabh", tb.offsetHeight + "px"); if (mt && mt.offsetHeight) r.setProperty("--mtoph", mt.offsetHeight + "px"); };

  if (!n) return;

  const head = document.querySelector(".lvl-block.is-current > .lvl-head");
  const ch = n.closest(".chapter");
  const mtop = document.querySelector(".mtop");
  const topBar = mtop && getComputedStyle(mtop).display !== "none" ? mtop.offsetHeight : 0;
  const headH = (head ? head.offsetHeight + 12 : 0) + topBar + 16;
  const nodeY = n.getBoundingClientRect().top + window.scrollY;
  // la leçon en cours est déjà visible en arrivant : on reste en haut (bande du jour et niveau visibles)
  if (nodeY + n.offsetHeight < window.innerHeight * 0.72) { window.scrollTo({ top: 0, behavior: "auto" }); return; }
  const chY = ch ? ch.getBoundingClientRect().top + window.scrollY : nodeY - 120;

const PATH_X = [0, 58, 88, 58, 0, -58, -88, -58];

function resizeImage(file, size = 160) {
  return new Promise((res, rej) => {
    if (!file || !/^image\//.test(file.type)) return rej({ message: "Choisis une image (JPG, PNG…)." });
    if (file.size > 10e6) return rej({ message: "Image trop lourde (10 Mo maximum)." });
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const c = document.createElement("canvas"); c.width = c.height = size;
      const s = Math.min(img.width, img.height);
      c.getContext("2d").drawImage(img, (img.width - s) / 2, (img.height - s) / 2, s, s, 0, 0, size, size);
      URL.revokeObjectURL(url); res(c.toDataURL("image/jpeg", .85));
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej({ message: "Cette image n'a pas pu être lue." }); };
    img.src = url;
  });
}

function logSentence(l) {
  const d = l.details || {}, t = `<b>${esc(l.target_name || "un compte")}</b>`;
  const unit = (k, n) => k === "xp" ? "XP" : k === "coins" ? (Math.abs(n) > 1 ? "pièces" : "pièce") : (Math.abs(n) > 1 ? "vies" : "vie");
  const perms = (a) => (a || []).map((k) => PERM_LABEL[k] || k).join(", ") || "aucun droit";
  switch (l.action) {
    case "gift": return [`a envoyé <b class="num">${d.n > 0 ? "+" : ""}${d.n} ${unit(d.kind, d.n)}</b> à ${t}`, d.kind === "coins" ? "coin" : d.kind === "xp" ? "xp" : "heart"];
    case "level": return [`a passé ${t} au niveau <b>${esc(d.level || "?")}</b>`, "level"];
    case "vip_on": return [`a donné le VIP à ${t}`, "vip"];
    case "vip_off": return [`a retiré le VIP de ${t}`, "vip"];
    case "plus_on": return [`a ${d.prolonge ? "prolongé" : "offert"} Verblyx Plus ${d.jours === -1 ? "à vie" : `pour ${d.jours} jours`} à ${t}`, "vip"];
    case "plus_off": return [`a retiré Verblyx Plus de ${t}`, "vip"];
    case "profile": return [`a modifié le profil de ${t} : ${Object.entries(d).map(([k, v]) => `${{ first_name: "prénom", username: "pseudo", email: "e-mail" }[k] || k} « ${esc((v && v[0]) || "vide")} » → « ${esc((v && v[1]) || "vide")} »`).join(", ")}`, "edit"];
    case "msg_done": return [`a traité un message de ${t}`, "msg"];
    case "msg_reopen": return [`a rouvert un message de ${t}`, "msg"];
    case "msg_delete": return [`a supprimé un message de ${t}${d.extrait ? ` : <span class="muted">« ${esc(d.extrait)} »</span>` : ""}`, "del"];
    case "staff_add": return [`a ajouté ${t} à l'équipe (${perms(d.apres)})`, "team"];
    case "staff_perms": return [`a changé les droits de ${t} : ${perms(d.apres)}`, "team"];
    case "staff_remove": return [`a retiré ${t} de l'équipe`, "del"];
    case "ai_limit": return [d.apres == null ? `a remis le quota IA de ${t} à la valeur normale` : `a fixé le quota IA de ${t} à <b class="num">${tokNum(d.apres)}</b> ${d.unite === "jetons" ? "jetons" : "échanges"} par jour`, "edit"];
    default: return [`${esc(l.action)} sur ${t}`, "edit"];
  }
}

/* ---------- Préparer toutes les leçons à l'avance (admin) ---------- */
const PREP = { running: false, stop: false, done: 0, total: 0, fail: 0, cur: "", ready: null, err: "", loading: false };
const lessonSteps = () => allSteps().filter((s) => s.kind === "lesson");
const isReady = (id) => !!(COURSE.content && COURSE.content[id]) || !!(PREP.ready && PREP.ready.has(id));
const prepSleep = async (sec) => { for (let i = 0; i < sec * 4 && !PREP.stop; i++) await new Promise((r) => setTimeout(r, 250)); };
const prepRender = () => { if (S.view === "admin" || S.view === "dashboard") render(); };
async function prepLoadReady() {
  PREP.loading = true;
  try { PREP.ready = new Set(await S.store.contentIds()); PREP.err = ""; }
  catch (e) { PREP.err = "Impossible de lire les leçons enregistrées : " + ((e && e.message) || "erreur"); PREP.ready = PREP.ready || new Set(); }
  PREP.loading = false; prepRender();
}
async function prepRun() {
  if (PREP.running) return;
  if (!PREP.ready) await prepLoadReady();
  const todo = lessonSteps().filter((s) => !isReady(s.id));
  Object.assign(PREP, { running: true, stop: false, done: 0, fail: 0, total: todo.length, err: "" });
  prepRender();
  let limited = 0;
  for (const st of todo) {
    if (PREP.stop) break;
    PREP.cur = `${st.level} · ${st.title}`; prepRender();
    let ok = false;
    for (let attempt = 0; attempt < 3 && !ok && !PREP.stop; attempt++) {
      try {
        const c = cleanContent(await S.sample.json(genPrompt(st), { modelTier: "default", purpose: "prep" }));
        await S.store.saveContent(st.id, c);
        PREP.ready.add(st.id); ok = true; limited = 0;
      } catch (e) {
        if (e && e.code === "session_expired") { PREP.err = "Ta session a expiré. Reconnecte-toi puis relance."; PREP.stop = true; }
        else if (e && e.code === "rate_limited") {
          limited++;
          if (limited >= 3) { PREP.err = "Le quota quotidien de Gemini est atteint. Les leçons prêtes sont conservées, relance demain pour terminer."; PREP.stop = true; break; }
          PREP.err = "Gemini demande une pause. Reprise automatique dans une minute."; prepRender();
          await prepSleep(60); PREP.err = "";
        }
      }
    }
    if (ok) PREP.done++; else if (!PREP.stop) PREP.fail++;
    prepRender();
    if (!PREP.stop) await prepSleep(4);
  }
  PREP.running = false; PREP.cur = "";
  prepRender();
}
window.addEventListener("beforeunload", (e) => { if (PREP.running) { e.preventDefault(); e.returnValue = ""; } });

// Télécharger toutes les leçons prêtes dans un fichier (sauvegarde)
async function exportLessons() {
  const u = S.ui; u.expBusy = true; render();
  try {
    const rows = await S.store.allContent();
    const out = { exported_at: new Date().toISOString(), lessons: {} };
    lessonSteps().forEach((s) => {
      const c = (COURSE.content && COURSE.content[s.id]) || (rows.find((r) => r.id === s.id) || {}).data;
      if (c) out.lessons[s.id] = { level: s.level, title: s.title, content: c };
    });
    const blob = new Blob([JSON.stringify(out, null, 2)], { type: "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = `verblyx-lecons-${today()}.json`;
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
    u.expMsg = `${Object.keys(out.lessons).length} leçons téléchargées.`;
  } catch (e) { u.expMsg = "Téléchargement impossible : " + ((e && e.message) || "erreur"); }
  u.expBusy = false; render();
}

      ${PREP.done && !PREP.running ? `<p class="small" style="color:var(--success)">${PREP.done} leçon${PREP.done > 1 ? "s" : ""} préparée${PREP.done > 1 ? "s" : ""} lors du dernier lancement.</p>` : ""}
      ${notice(PREP.err, "warn")}

function rkCountdown(at) {

}
const rkKey = () => "verblyx:league:" + ((S.authUser && S.authUser.id) || "x");
async function rkLoad(league, force) {
  const k = league || "_me";
  if (RK.busy[k] || (!force && RK.data[k] && Date.now() - RK.at[k] < 60e3)) return;
  RK.busy[k] = true; RK.err = ""; if (S.view === "competition") render();
  try {
    if (!S.store.rankedBoard) throw { message: "Le classement Ranked est disponible une fois connecté." };
    const d = await S.store.rankedBoard(league);
    RK.data[k] = d; RK.at[k] = Date.now();
    if (!league) RK.data[d.league] = d, RK.at[d.league] = Date.now();
    if (d.me) {
      RK.me = d.me;
      // montée de ligue : grande fenêtre de fête ; on retient la ligue pour la prochaine fois
      let prev = null; try { const s = (localStorage.getItem(rkKey()) || "").split("|"); if (s[0] === d.week) prev = s[1]; } catch {}
      if (prev && lgIdx(d.me.league) > lgIdx(prev)) S.leaguePop = { league: d.me.league, from: prev, fresh: true };
      try { localStorage.setItem(rkKey(), `${d.week}|${d.me.league}`); } catch {}
      const p = S.profile;
      if (p && (!p.best_league || lgIdx(d.me.league) > lgIdx(p.best_league) || (d.me.league === p.best_league && d.me.lpos < (p.best_lpos || 1e9)))) {
        p.best_league = d.me.league; p.best_lpos = d.me.lpos; p.best_league_week = d.week; saveProfile();
      }
    }
  } catch (e) {
    const m = (e && e.message) || "";
    RK.err = /function|schema cache|does not exist/i.test(m) ? "Le Ranked n'est pas encore activé (lance 013_ranked.sql dans Supabase)." : m || "Impossible de charger le classement Ranked.";
  }
  RK.busy[k] = false;
  if (S.view === "competition" || (S.leaguePop && S.leaguePop.fresh && S.view !== "session")) render();
}

/* ---------- Plus de vies ---------- */
function outView(ses) {
  const p = S.profile, t = heartTimer(), can = (p.coins || 0) >= HEART_COST;
  const canReview = dueWords().length > 0 || (p.mistakes || []).length > 0;
  return `<div class="flow"><div class="flow-top"><button class="icon-btn" data-act="ses-quit" aria-label="Quitter">${icon("i-close")}</button>${progress(ses.items ? (ses.i / ses.items.length) * 100 : 0)}<span class="hearts-mini low">${heartImg(false, 28)}0</span></div>
    <main class="flow-body" style="align-items:center;text-align:center">
      <div class="out-hearts">${Array.from({ length: HEART_MAX }, (_, k) => `<span style="--i:${k}">${heartImg(false, 44)}</span>`).join("")}</div>
      ${vx("sad", 130, "lead")}
      <h1 class="h1">Plus de vies !</h1>
      <p class="muted" style="max-width:28em">Pas de panique : chaque erreur t'apprend quelque chose. ${t ? `Toutes tes vies reviennent dans ${t}.` : ""}</p>
      <div class="stack" style="width:100%;max-width:360px;gap:10px">
        <button class="btn btn-primary btn-lg btn-block" data-act="buy-heart-go" ${can ? "" : "disabled"}>${icon("i-heart")} Racheter une vie · ${HEART_COST} pièces</button>
        ${can ? "" : `<p class="small muted">Tu as ${p.coins || 0} pièces : il en faut ${HEART_COST}.</p>`}
        <button class="btn btn-secondary btn-lg btn-block" data-act="review" ${canReview ? "" : "disabled"}>Réviser pour regagner une vie</button>
        <button class="btn btn-ghost btn-block" data-act="ses-quit">Revenir plus tard</button>
      </div>
    </main></div>`;
}

/* ---------- Profil ---------- */
function viewProfile() {
  const p = S.profile, xp = p.xp || 0, n = xpLevel(xp), lo = xpLevelFloor(n), hi = xpLevelFloor(n + 1);
  const sk = skillList();
  const weak = sk.filter((s) => s.mastery < 0.65).slice(0, 4);
  const strong = [...sk].reverse().filter((s) => s.mastery >= 0.75 && s.attempts >= 2).slice(0, 4);
  const c = badgeCtx(), pulse = liveStreak();
  if (!RK.me && !RK.busy._me && !RK.err && S.store && S.store.rankedBoard) setTimeout(() => rkLoad(null), 0);
  const words = Object.values(S.vocab || {}).filter((w) => w.learned).length;
  const since = (() => { try { const d = new Date(p.created_at); return isNaN(d) ? "" : d.toLocaleDateString("fr-FR", { month: "long", year: "numeric" }); } catch { return ""; } })();
  const fmt = (x) => Number(x || 0).toLocaleString("fr-FR");
  const tile = (ic, v, t, off) => `<div class="pf-stat ${off ? "off" : ""}"><span class="pf-stat-ic">${ic === "plusheart" ? plusHeart(28) : em(ic, 28)}</span><span class="pf-stat-tx"><b class="num">${v}</b><span>${t}</span></span></div>`;
  const block = (title, items, good, empty) => `<section class="card pad"><h2 class="pf-h">${title}</h2><div style="margin-top:12px">${items.length ? items.map((s) => `<div class="skill"><div class="t"><span>${esc(skillLabel(s.skill))}</span><span class="small muted num">${Math.round(s.mastery * 100)} %</span></div>${progress(Math.max(6, s.mastery * 100), "thin" + (good ? "" : " weak"))}</div>`).join("") : `<p class="small muted">${empty}</p>`}</div></section>`;
  return `
  <section class="pf-hero enter">
    <div class="pf-id">
      ${avatarHTML(p, 76, S.isVip)}
      <div class="pf-who">
        <h1 class="pf-name">${esc(p.first_name || "Élève")}${S.isVip ? vipTag() : ""}${isPlus() ? plusTag() : ""}</h1>
        <p class="pf-handle">${p.username ? "@" + esc(p.username) : "Sans pseudo"}</p>${since ? `<p class="pf-since">Membre depuis ${since}</p>` : ""}
        <div class="pf-tags"><span class="pf-tag">${esc(p.cefr_level)} · ${LEVEL_NAMES[p.cefr_level]}</span><span class="pf-tag">Niveau ${n}</span></div>
      </div>
      <button class="icon-btn pf-gear" data-act="settings-open" aria-label="Paramètres" title="Paramètres">${icon("i-gear")}</button>
    </div>
    <div class="pf-xp">
      <div class="pf-xp-top"><span><b>Niveau ${n}</b> <span class="muted">→ ${n + 1}</span></span><span class="small muted num">${fmt(xp - lo)} / ${fmt(hi - lo)} XP</span></div>
      ${progress(((xp - lo) / (hi - lo)) * 100)}
      <p class="small muted num">Encore ${fmt(hi - xp)} XP pour passer au niveau ${n + 1}</p>
    </div>
  </section>
  <section class="enter-2">
    <h2 class="pf-h">Statistiques</h2>
    <div class="pf-stats">
      ${tile("fire", fmt(pulse), pulse > 1 ? "Jours d'affilée" : "Jour d'affilée", !pulse)}
      ${tile("bolt", fmt(xp), "XP gagnés")}
      ${tile("books", fmt(c.done), c.done > 1 ? "Leçons terminées" : "Leçon terminée", !c.done)}
      ${tile("trophy", fmt(c.bestStreak), "Record de Pulse", !c.bestStreak)}
      ${tile("target", fmt(c.goals), c.goals === 1 ? "Objectif atteint" : "Objectifs atteints", !c.goals)}
      ${tile("read", fmt(words), words === 1 ? "Mot maîtrisé" : "Mots maîtrisés", !words)}
      ${tile("coin", fmt(p.coins), "Pièces")}
      ${isPlus() ? tile("plusheart", "∞", "Vies illimitées") : tile("heart", `${p.hearts ?? HEART_MAX}/${HEART_MAX}`, "Vies")}
    </div>
  </section>
  ${isPlus() ? `<section class="card pad pf-row pf-plus"><div class="row" style="gap:12px;flex-wrap:nowrap;min-width:0">${plusHeart(34)}<div style="min-width:0"><b>Verblyx Plus</b><p class="small muted">Actif ${esc(plusStatus(S.plus))} · vies illimitées, XP x2, 3x plus de Prof IA, sans pub.</p></div></div><button class="btn btn-secondary btn-sm pf-btn" data-go="shop">Détails</button></section>` : ""}
  <section class="enter-3">

      ${(() => { const cur = RK.me, best = p.best_league; const card = (lg, title, sub, cls = "") => `<button class="pf-rk-card ${cls}" data-go="competition" style="--lg-a:${LG(lg).a};--lg-glow:${LG(lg).glow}">${leagueBadge(lg, 52)}<span class="pf-rk-tx"><span>${title}</span><b>Ligue ${LG(lg).name}</b><small>${sub}</small></span></button>`;
        return (cur ? card(cur.league, "Rang actuel", `#${cur.lpos} cette semaine · ${fmt(cur.score)} XP`) : `<div class="pf-rk-card is-empty"><span class="pf-rk-tx"><span>Rang actuel</span><b>…</b><small>Chargement</small></span></div>`)
          + (best ? card(best, "Meilleur rang", p.best_lpos ? `Record : #${p.best_lpos} en ${LG(best).name}` : "Ton record", "is-best") : `<div class="pf-rk-card is-empty"><span class="pf-rk-tx"><span>Meilleur rang</span><b>—</b><small>Termine une leçon pour entrer au classement</small></span></div>`); })()}
    </div>

  <section class="card pad pf-row">
    <div style="min-width:0"><b>Boutique</b><p class="small muted">Recharge tes vies ou protège ton Pulse avec tes pièces.</p></div>
    <button class="btn btn-primary btn-sm pf-btn" data-go="shop">Ouvrir</button>
  </section>
  <section class="card pad">
    <div class="row between" style="gap:8px"><h2 class="pf-h">Temps par jour</h2><span class="small muted">Objectif : ${goalXp()} XP par jour</span></div>
    <div class="pf-times">${TIMES.map((m) => `<button class="${p.daily_minutes === m ? "is-on" : ""}" data-act="set-time" data-v="${m}">${m} min</button>`).join("")}</div>
  </section>
  ${badgesCard()}
  <div class="grid-2">${block("Points forts", strong, true, "Termine quelques leçons pour les voir apparaître.")}${block("À travailler", weak, false, "Aucune difficulté repérée pour l'instant.")}</div>`;
}

/* ---------- Séance (leçon, test, examen, révision) ---------- */
const EX_LABEL = { mcq: "Choisis la bonne réponse", read: "Lis, puis réponds", fill: "Complète la phrase", order: "Remets les mots dans l'ordre", tr_en_fr: "Traduis en français", tr_fr_en: "Traduis en anglais", listen: "Écoute et reconstruis la phrase", match: "Associe les paires", speak: "Lis cette phrase à voix haute", build: "À toi d'écrire", talk: "Réponds en anglais" };
const METHOD = ["Comprendre", "Analyser", "S'entraîner", "Maîtriser"];
function methodStep(it) { return it.t === "understand" ? 0 : it.t === "analyze" ? 1 : it.phase === "master" ? 3 : 2; }
function speakerBtn(text, slow) { return S.tts ? `<button class="icon-btn spk" data-act="say" data-v="${esc(text)}" ${slow ? 'data-slow="1"' : ""} aria-label="${slow ? "Écouter lentement" : "Écouter"}">${icon(slow ? "i-turtle" : "i-sound")}</button>` : ""; }
function viewSession() {
  const ses = S.session, u = S.ui;
  if (!ses) return "";
  if (ses.out) return outView(ses);
  if (ses.loading) return `<div class="flow"><div class="flow-top"><button class="icon-btn" data-act="ses-quit" aria-label="Annuler">${icon("i-close")}</button>${progress(3)}</div>
    <main class="flow-body" style="align-items:center;text-align:center;justify-content:center">${vx("think", 160, "lead")}
      <h1 class="h2">${esc(ses.title)}</h1><p class="muted" id="gen-msg">${ses.ai ? (ses.focus ? "Vex prépare un entraînement rien que pour toi…" : "Vex écrit cette leçon pour la toute première fois…") : "Ouverture de la leçon…"}</p><p class="small muted num" id="gen-t">0 s</p>
      <div class="stack" style="width:100%;max-width:420px;gap:10px"><div class="skel" style="height:14px"></div><div class="skel" style="height:14px;width:80%"></div><div class="skel" style="height:14px;width:60%"></div></div>
      <p class="small muted" id="gen-note" ${ses.ai ? "" : "hidden"}>Cette leçon n'avait encore jamais été ouverte : Vex l'écrit maintenant, puis elle sera enregistrée et instantanée pour tout le monde.</p>
    </main></div>`;
  if (ses.error) return `<div class="flow"><div class="flow-top"><button class="icon-btn" data-act="ses-quit" aria-label="Fermer">${icon("i-close")}</button>${progress(0)}</div>
    <main class="flow-body" style="align-items:center;text-align:center">${vx("sad", 140, "lead")}<h1 class="h2">Séance indisponible</h1><p class="muted">${esc(ses.error)}</p>
    <div class="row" style="justify-content:center">${ses.st ? `<button class="btn btn-primary" data-act="retry-open">Réessayer</button>` : ""}<button class="btn btn-secondary" data-act="ses-quit">Retour</button></div></main></div>`;
  if (ses.done) return ses.cheer ? cheerView(ses) : resultView(ses);
  const it = ses.items[ses.i], total = ses.items.length;
  const isLesson = ses.kind === "lesson" || ses.kind === "focus";
  let body = "", foot = "", footCls = "";
  const stepper = it.t === "bonusIntro" || it.bonus ? `<div class="method single"><span class="on bonus">${goldStar(14)} Bonus</span></div>` : isLesson ? `<div class="method">${METHOD.map((m, k) => `<span class="${k === methodStep(it) ? "on" : k < methodStep(it) ? "past" : ""}">${m}</span>`).join("")}</div>` : `<div class="method single"><span class="on">${ses.kind === "unit" ? "Test de l'unité" : ses.kind === "exam" ? `Examen ${ses.st.level}` : ses.kind === "review" ? "Révision" : "Entraînement"}</span></div>`;
  const fresh = !u.seen; u.seen = true;
  if (it.t === "bonusIntro") {
    body = `<div class="bonus-intro">
      <div class="bonus-rays" aria-hidden="true"></div>
      <span class="bonus-star">${goldStar(96)}</span>
      <span class="bonus-kick">Sans aucune faute</span>
      <h1 class="bonus-title">Question bonus</h1>
      <p class="bonus-txt">Une dernière question, plus difficile : traduis une phrase en anglais, <b>sans aide</b>, au clavier.</p>
      <div class="bonus-prize"><span>${em("coin", 22)} +${BONUS_COINS} pièces</span><span>${em("bolt", 22)} +${BONUS_XP} XP</span></div>
      <p class="small muted">Aucune vie en jeu : tu ne risques rien.</p>
    </div>`;
    foot = `<button class="btn btn-ghost" data-act="bonus-skip">Passer</button><button class="btn btn-primary btn-lg" data-act="next">Relever le défi</button>`;
  } else if (it.t === "understand") {
    const c = ses.content;
    body = `${ask("book", c.goal || ses.st.goal, ses.title)}
      <div class="card pad stack" style="gap:14px"><p style="font-size:16px;line-height:1.7">${esc(c.understand.text)}</p>
        <div class="ex-list">${c.understand.examples.map(([en, fr]) => `<div class="ex-line">${speakerBtn(en)}<div><b>${esc(en)}</b><span>${esc(fr)}</span></div></div>`).join("")}</div></div>`;
    foot = `<span></span><button class="btn btn-primary btn-lg" data-act="next">Continuer</button>`;
  } else if (it.t === "analyze") {
    const a = ses.content.analyze;
    body = `${ask("think", "Observe bien comment la phrase est construite.")}
      <div class="card pad stack" style="gap:16px">
        <div class="row" style="gap:6px;align-items:flex-start">${speakerBtn(a.sentence)}<p class="sentence" style="flex:1;min-width:0">${esc(a.sentence)}</p></div>
        <div class="parts">${a.parts.map(([w, r], k) => `<div class="part p${k % 4}"><b>${esc(w)}</b><span>${esc(r)}</span></div>`).join("")}</div>

const sumDays = (o, n) => { let s = 0; for (let i = 0; i < n; i++) s += Number(o[addDays(-i)] || 0); return s; };

// Récompenses : seulement pour des compétences démontrées, avec un plafond par jour
function coachReward(xp, coins, why) {
  const p = S.profile, c = coachData(), t = today();
  const xpLeft = Math.max(0, COACH_XP_CAP - (c.xp[t] || 0)), coinLeft = Math.max(0, COACH_COIN_CAP - (c.coins[t] || 0));
  xp = Math.min(xp, xpLeft); coins = Math.min(coins, coinLeft);
  if (!xp && !coins) return;
  c.xp[t] = (c.xp[t] || 0) + xp; c.coins[t] = (c.coins[t] || 0) + coins; pruneDays(c.xp); pruneDays(c.coins);
  if (xp) {
    const y = yesterday();
    p.streak = p.last_active === t ? p.streak : p.last_active === y ? (p.streak || 0) + 1 : 1;
    p.last_active = t; p.best_streak = Math.max(p.best_streak || 0, p.streak);
    p.days = p.days || {}; const before = p.days[t] || 0; p.days[t] = before + xp;
    if (before < goalXp() && p.days[t] >= goalXp()) { p.goal_days = (p.goal_days || 0) + 1; coins += 10; }
    if (isPlus()) { xp *= 2; p.days[t] = before + xp; } // Plus : XP x2
    const lvB = xpLevel(p.xp || 0); p.xp = (p.xp || 0) + xp;
    const lvA = xpLevel(p.xp); if (lvA > lvB) S.levelPop = { n: lvA, up: true, cefr: null, fresh: true };
  }
  p.coins = (p.coins || 0) + coins;
  p.badges = unlockedBadges();
  CO.toast = { text: [xp ? `+${xp} XP` : "", coins ? `+${coins} pièces` : ""].filter(Boolean).join(" · "), why, at: Date.now() };
  setTimeout(() => { if (CO.toast && Date.now() - CO.toast.at >= 2900) { CO.toast = null; if (S.view === "coach") paintCoachTop(); } }, 3000);
  coachSaveSoon();
}

function coachRules(p) {

Points faibles connus : ${[...errs, ...weakSkills().map(skillLabel), ...(p.difficulties || [])].join(", ") || "aucun identifié pour l'instant"}.
${CO.mood === "tired" || CO.mood === "bad" ? "L'élève est fatigué aujourd'hui : séance courte, phrases simples, encouragements sincères.\n" : ""}${CO.topic && CO.topic.label ? `Thème choisi pour cette séance : ${CO.topic.label}.\n` : ""}${sc ? `MODE SIMULATION : ${sc[2]} Joue ce rôle en anglais, avec des phrases courtes et naturelles${simple ? " très simples" : ""}, et pose une question à la fois pour faire avancer la scène. Si l'élève fait une erreur, ajoute après ta réplique une ligne « 💡 » en français avec la correction (❌ → ✅). Reste dans la scène.` : ""}${CO.voice ? `MODE VOCAL : ta réponse sera lue à voix haute. Réponds surtout en anglais, en 1 à 3 phrases courtes et faciles à prononcer, sans listes ni mise en forme. Les corrections restent très brèves.` : ""}

// Retire la ligne de bilan (et ce qui pourrait en être le début pendant l'écriture)
const stripBilan = (t) => String(t || "").replace(/\s*\[\[bilan:[^\]]*\]\]\s*$/i, "").replace(/\s*\[\[[^\]]*$/, "").replace(/\s*\[\[bilan:[^\]]*\]\]/gi, "");

  const v = m[1].trim().toLowerCase(), c = coachData(), t = today();
  if (v === "ok") {
    const words = String(userText).trim().split(/\s+/).length;
    c.ok = (c.ok || 0) + 1; c.okDays[t] = (c.okDays[t] || 0) + 1; pruneDays(c.okDays);

  cats.forEach((k) => {
