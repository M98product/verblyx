/* ---------- Envoyer un message ---------- */
async function sendChat(text, opts = {}) {
  const t = String(text || "").trim();
  const u = S.ui;
  if (!t || !S.sample || coachBusy()) return;
  if (aiBlocked()) { S.chat.push({ role: "assistant", error: true, content: "quota", local: true }); render(); return; }
  stopSpeaking();
  const tool = CO.tool && TOOLS.find((x) => x[0] === CO.tool);
  const sent = tool && tool[4] ? `${tool[4]}\n${t}` : t;
  u.streamAt = Date.now();
  dropErrors();
  S.chat.push({ role: "user", content: sent.slice(0, 2400), ...(opts.label ? { label: opts.label, icon: opts.icon } : tool && tool[4] ? { label: t.slice(0, 2000), tag: tool[1] } : {}) });
  CO.tool = null; CO.toolsOpen = false; CO.wordsFor = null;
  SFX.play("tap");
  u.chatDraft = ""; u.chatError = ""; u.streaming = ""; S.chatScroll = true; CO.vstate = "think"; render();
  const turns = [{ role: "user", content: coachRules(S.profile) }, ...chatTurns()];
  let reply = "";
  try {
    ({ text: reply } = await S.sample(turns, { modelTier: "quick", cache: false, onText: ({ text: tx }) => {
      u.streaming = tx; if (CO.vstate !== "talk") { CO.vstate = "talk"; paintCoachTop(); }
      const el = document.getElementById("stream"); if (el) el.innerHTML = streamView(stripBilan(tx));
      scrollChatEnd();
    } }));
    aiSpent();
    const res = readBilan(reply, opts.label ? "" : t);
    const { text: rest, quiz } = splitQuiz(stripBilan(reply));
    S.chat.push(quiz ? { role: "assistant", content: stripBilan(reply), text: rest, quiz } : { role: "assistant", content: stripBilan(reply), ...(res && res.ok ? { praise: true } : {}) });
    CO.vstate = res ? (res.ok ? "joy" : "encourage") : "";
    SFX.play("pop");
  } catch (e) {
    if (e && e.text) { aiSpent(); S.chat.push({ role: "assistant", content: stripBilan(e.text) + "\n\n(réponse interrompue)" }); }
    else S.chat.push({ role: "assistant", error: true, content: aiError(e) || "Vex n'a pas pu répondre.", retry: { type: "chat", text: t, opts } });
    if (e && e.code === "rate_limited") loadAiUsage();
    CO.vstate = "";
  }
  u.streaming = null; S.chatScroll = true;
  if (opts.next && reply) askNext(opts.next);
  coSave(); render();
  if (CO.vstate) setTimeout(() => { if (S.view === "coach" && !coachBusy()) { CO.vstate = ""; paintCoachTop(); } }, 2600);
  if (CO.voice && reply) voiceReply(stripBilan(reply));

}

function coachAction(act, v, el) {
  const u = S.ui, c = () => coachData();
  if (act === "plus-locked") { S.plusModal = v; S.plusAnim = true; CO.toolsOpen = false; SFX.play("tap"); render(); return true; }
  if (act === "plus-close" || act === "plus-see" || act === "plus-plan") return false;
  if ((act === "co-panel" && plusLocked(v)) || (act === "voice" && plusLocked("voice")) || ((act === "role" || (act === "tool" && v === "sim") || (act === "co-start" && v === "sim")) && plusLocked("sim"))) { S.plusModal = act === "co-panel" ? v : act === "voice" ? "voice" : "sim"; S.plusAnim = true; CO.toolsOpen = false; render(); return true; }
  CO.lockInfo = null;
  switch (act) {
    case "co-panel": if (v === "focus") return true; CO.panel = v && CO.panel !== v ? v : v && CO.panel === v && !el.closest(".c2-side") ? null : v || null; if (CO.panel === "focus") { const k = c().set.mode; if (k && FOCUS.mode !== k && !FOCUS.running && !FOCUS.elapsed) focusReset(k); } render(); return true;
    case "co-new": coNew(); SFX.play("tap"); render(); return true;
    case "co-choice": coChoice(v, el.dataset.l || v); return true;
    case "co-open": coOpen(v); SFX.play("tap"); S.chatScroll = true; render(); return true;
    case "co-del": CO.hist = CO.hist.filter((x) => x.id !== v); coSave(); render(); return true;
    case "co-start": {
      if (v === "free") { const i = document.getElementById("coachInput"); if (i) { i.placeholder = "Say something in English…"; i.focus(); } return true; }
      if (v === "sim") { CO.toolsOpen = "sim"; render(); return true; }
      if (v === "ex") { quickQuiz("quick"); return true; }
      if (v.startsWith("cat:")) { quickQuiz("cat", v.slice(4)); return true; }
      return true;
    }
    case "tools": CO.toolsOpen = CO.toolsOpen ? false : true; SFX.play("tap"); render(); return true;
    case "tool": {
      if (v === "sim") { CO.toolsOpen = "sim"; render(); return true; }
      CO.tool = v; CO.toolsOpen = false; render();
      const i = document.getElementById("coachInput"); if (i) i.focus();
      return true;
    }
    case "tool-off": CO.tool = null; render(); return true;
    case "role": startRole(v); return true;
    case "role-end": endRole(); return true;
    case "qcm-cat": CO.panel = matchMedia("(min-width: 1100px)").matches ? CO.panel : null; quickQuiz("cat", v); return true;
    case "qcm-theme": quickQuiz("quick", v); return true;
    case "m-say": sayMessage(Number(v)); return true;
    case "m-tr": translateMessage(Number(v)); return true;
    case "m-ex": explainMessage(Number(v)); return true;
    case "m-words": CO.wordsFor = CO.wordsFor === Number(v) ? null : Number(v); render(); return true;
    case "w-save": { const m = S.chat[Number(el.dataset.m)]; saveWord(v, m ? stripBilan(m.text || m.content) : ""); return true; }
    case "voc-say": if (S.tts) S.tts.speak(v, { lang: "en-US", rate: 0.9 }).catch(() => {}); return true;
    case "voc-add": { const m = S.chat[Number(el.dataset.m)]; const w = m && m.vocab && m.vocab.words[Number(v)]; if (w && addWord(w.w, w.t, w.ex)) render(); return true; }
    case "voc-all": { const m = S.chat[Number(el.dataset.m)]; let n = 0; if (m && m.vocab) m.vocab.words.forEach((w) => { if (addWord(w.w, w.t, w.ex)) n++; }); if (n) CO.toast = { text: `${n} mot${n > 1 ? "s" : ""} ajouté${n > 1 ? "s" : ""} à tes mots`, at: Date.now() }; render(); return true; }
    case "mic": {
      if (CO.listening) { try { S.dict.stop(); } catch {} CO.listening = false; CO.vstate = ""; render(); return true; }
      startListening(); return true;
    }
    case "voice": {
      if (CO.voice) { stopVoice(); render(); return true; }
      CO.voice = true; SFX.play("select"); render(); startListening(); return true;
    }
    case "fx-mode": focusReset(v); coachSaveSoon(); render(); return true;
    case "fx-play": if (FOCUS.running) focusPause(); else focusStart(); return true;
    case "fx-reset": focusReset(); FOCUS.sessionSec = 0; render(); return true;
    case "fx-break": focusBreak(); return true;
    case "fx-again": focusReset("pomodoro"); focusStart(); render(); return true;
    case "fx-goalmin": c().set.goalMin = Number(v) || 25; coachSaveSoon(); render(); return true;
    case "snd": { const s = c().set; s.sound = v; coachSaveSoon(); if (v === "silence") ambStop(); else ambPlay(v, s.vol); SFX.play("tap"); render(); return true; }
  }
  return false;
}

  if (v === (old || "")) { u.userOk = "C'est déjà ton pseudo."; return render(); }
  if (v && !PSEUDO_RE.test(v)) { u.userErr = "3 à 20 caractères : lettres minuscules, chiffres, point ou tiret bas."; return render(); }
  if (v && !(await pseudoFree(v))) { u.userErr = "Ce pseudo est déjà pris. Choisis-en un autre."; return render(); }
  if (v) S.profile.username = v; else delete S.profile.username;
  try { await S.store.saveProfile(S.profile); u.userDraft = null; u.userOk = v ? "Pseudo enregistré." : "Pseudo retiré."; SFX.play("select"); if (v) PSEUDO_FREE[v] = true; }
  catch (e) { if (old) S.profile.username = old; else delete S.profile.username; u.userErr = /duplicate|unique|23505/i.test(String((e && (e.message || e.code)) || "")) ? "Ce pseudo vient d'être pris : choisis-en un autre." : "Impossible d'enregistrer pour le moment."; }
  render();
}
async function sendHelp() {
  const u = S.ui, msg = ((document.getElementById("setHelp") || {}).value || "").trim();
  u.helpOk = ""; u.helpErr = "";
  if (msg.length < 3) { u.helpErr = "Écris un message un peu plus long."; return render(); }
  u.helpBusy = true; render();
  try { await S.store.sendFeedback(msg); u.helpDraft = ""; u.helpOk = "Message envoyé. L'équipe te répondra par e-mail."; SFX.play("select"); }
  catch (e) { u.helpErr = /function|schema cache|does not exist/i.test((e && e.message) || "") ? "L'envoi de messages n'est pas encore activé." : ((e && e.message) || "L'envoi a échoué. Réessaie dans un instant."); }
  u.helpBusy = false; render();
}
async function doLogout() {
  try { await SB.auth.signOut(); } catch {}
  S.settingsOpen = false; S.chat = []; try { sessionStorage.removeItem("verblyx:chat"); } catch {}
  stopVoice(); ambStop(); focusPause(); focusReset("pomodoro"); FOCUS.sessionSec = 0; CO.loaded = false; CO.ai = null; CO.panel = null;
  await enterSession(null);
  go("home");
}
S.view = "home"; S.profile = null; S.store = makeLocalStore();
boot().catch((e) => {
  console.error(e);
  const msg = String((e && e.message) || e).replace(/[<>&]/g, "");
  $app.innerHTML = bootScreen("Verblyx n'a pas pu démarrer", `Vérifie l'adresse et la clé dans config.js (adresse du type https://xxxx.supabase.co, sans rien après).<br><br><code>${msg}</code>`);
});


})();
