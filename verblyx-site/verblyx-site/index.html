    onFinal: (h) => fin.push(h), onState: (h) => st.push(h), active: () => !!rec,
    start: () => new Promise((res, rej) => {
      try {
        rec = new R(); rec.lang = "en-US"; rec.interimResults = false; rec.continuous = false;
        rec.onresult = (e) => { for (let i = e.resultIndex; i < e.results.length; i++) if (e.results[i].isFinal) fin.forEach((h) => h({ text: " " + e.results[i][0].transcript })); };

const frAuth = (m) => {
  m = String(m || "");
  if (/invalid login/i.test(m)) return "E-mail ou mot de passe incorrect.";
  if (/already registered|already exists/i.test(m)) return "Un compte existe déjà avec cet e-mail : connecte-toi.";
  if (/email not confirmed/i.test(m)) return "Confirme d'abord ton adresse e-mail (regarde dans ta boîte de réception).";
  if (/password should be at least|weak password/i.test(m)) return "Ton mot de passe doit faire au moins 8 caractères.";
  if (/rate limit|too many/i.test(m)) return "Trop de tentatives. Patiente une minute avant de réessayer.";
  if (/invalid email|valid email/i.test(m)) return "Cette adresse e-mail ne semble pas valide.";
  return m || "Une erreur est survenue. Réessaie.";
};
const okEmail = (e) => /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(String(e || "").trim());

/* ---------- Connexion ---------- */
function authShell(inner) {
  return `<div class="flow"><header class="flow-top"><button class="icon-btn" data-go="home" aria-label="Retour à l'accueil">${icon("i-back")}</button><span style="flex:1"></span>${soundBtn()}</header>
    <main class="flow-body enter" style="max-width:440px">${inner}</main></div>`;
}
function viewLogin() {
  const u = S.ui;
  if (u.forgot) return authShell(`${ask("think", "Pas de souci : je t'envoie un lien pour choisir un nouveau mot de passe.", "", 110)}
    <form class="stack" data-form="forgot" novalidate style="gap:12px">
      <label class="field"><span class="label">Adresse e-mail</span><input id="loginEmail" class="input" type="email" autocomplete="email" value="${esc(u.email || "")}" placeholder="toi@exemple.com"></label>
      ${u.info ? `<div class="notice">${esc(u.info)}</div>` : ""}${notice(u.error)}
      <button class="btn btn-primary btn-lg btn-block" ${u.busy ? "disabled" : ""}>${u.busy ? '<span class="spinner"></span>' : ""}Envoyer le lien</button>
      <button type="button" class="btn btn-ghost" data-act="forgot-off">Retour à la connexion</button>
    </form>`);
  return authShell(`${ask("wave", "Content de te revoir ! Connecte-toi pour reprendre ton parcours.", "", 110)}
    <form class="stack" data-form="login" novalidate style="gap:12px">
      <label class="field"><span class="label">Adresse e-mail</span><input id="loginEmail" class="input" type="email" autocomplete="email" value="${esc(u.email || "")}" placeholder="toi@exemple.com"></label>
      <label class="field"><span class="label">Mot de passe</span><input id="loginPass" class="input" type="password" autocomplete="current-password" placeholder="Ton mot de passe"></label>
      ${notice(u.error)}
      <button class="btn btn-primary btn-lg btn-block" ${u.busy ? "disabled" : ""}>${u.busy ? '<span class="spinner"></span>' : ""}Se connecter</button>
      <div class="row between"><button type="button" class="link" data-act="forgot-on">Mot de passe oublié ?</button><button type="button" class="link" data-act="start">Créer un compte</button></div>
    </form>`);
}
function viewCheckMail() {
  return authShell(`${ask("love", "Presque fini ! Confirme ton adresse e-mail.", "", 120)}
    <div class="card pad stack" style="gap:8px"><p>Je t'ai envoyé un lien de confirmation à <b>${esc(S.ui.email || "ton adresse")}</b>.</p><p class="small muted">Clique dessus, puis reviens ici pour te connecter. Pense à regarder dans les spams.</p></div>
    <button class="btn btn-primary btn-lg btn-block" data-go="login">J'ai confirmé, me connecter</button>`);
}
function viewNewPass() {
  const u = S.ui;
  return authShell(`${ask("go", "Choisis ton nouveau mot de passe.", "", 110)}
    <form class="stack" data-form="newpass" novalidate style="gap:12px">
      <label class="field"><span class="label">Nouveau mot de passe</span><input id="newPass" class="input" type="password" autocomplete="new-password" placeholder="8 caractères minimum"></label>
      ${notice(u.error)}
      <button class="btn btn-primary btn-lg btn-block" ${u.busy ? "disabled" : ""}>Enregistrer</button>
    </form>`);
}
async function doLogin() {
  const u = S.ui, email = (document.getElementById("loginEmail").value || "").trim(), pass = document.getElementById("loginPass").value || "";
  u.email = email;
  if (!okEmail(email)) { u.error = "Cette adresse e-mail ne semble pas valide."; return render(); }
  if (!pass) { u.error = "Indique ton mot de passe."; return render(); }
  u.busy = true; u.error = ""; render();
  const { data, error } = await SB.auth.signInWithPassword({ email, password: pass });
  if (error) { u.busy = false; u.error = frAuth(error.message); return render(); }
  SFX.play("fanfare");
  await enterSession(data.session);
}
async function doForgot() {
  const u = S.ui, email = (document.getElementById("loginEmail").value || "").trim(); u.email = email;
  if (!okEmail(email)) { u.error = "Cette adresse e-mail ne semble pas valide."; return render(); }
  u.busy = true; u.error = ""; render();
  const { error } = await SB.auth.resetPasswordForEmail(email, { redirectTo: location.origin + location.pathname });
  u.busy = false;
  if (error) u.error = frAuth(error.message); else u.info = "Si un compte existe pour cette adresse, tu vas recevoir un lien dans quelques minutes.";
  render();
}
async function doNewPass() {
  const u = S.ui, pw = document.getElementById("newPass").value || "";
  if (pw.length < 8) { u.error = "Ton mot de passe doit faire au moins 8 caractères."; return render(); }
  u.busy = true; render();
  const { error } = await SB.auth.updateUser({ password: pw });
  if (error) { u.busy = false; u.error = frAuth(error.message); return render(); }
  const { data } = await SB.auth.getSession();
  history.replaceState(null, "", location.pathname);
  await enterSession(data.session);
}
async function doLogout() {
  try { await SB.auth.signOut(); } catch {}
  S.settingsOpen = false; S.chat = []; try { sessionStorage.removeItem("verblyx:chat"); } catch {}
  await enterSession(null);
  go("home");
}
S.view = "home"; S.profile = null; S.store = makeLocalStore();
boot().catch((e) => {
  console.error(e);
  const msg = String((e && e.message) || e).replace(/[<>&]/g, "");
  $app.innerHTML = bootScreen("Verblyx n'a pas pu démarrer", `Vérifie l'adresse et la clé dans config.js (adresse du type https://xxxx.supabase.co, sans rien après).<br><br><code>${msg}</code>`);
});


})();
</script>
